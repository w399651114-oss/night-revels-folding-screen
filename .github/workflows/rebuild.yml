name: Rebuild both Blender experiments
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Blender 5.2.4 LTS (official Linux x64 archive)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive=blender-5.2.4-linux-x64.tar.xz
          curl --fail --location --retry 3 "https://download.blender.org/release/Blender5.2/$archive" -o "$archive"
          echo "2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86  $archive" | sha256sum -c -
          tar -xf "$archive"
          echo "BLENDER=$RUNNER_TEMP/blender-5.2.4-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Open, rebuild, measure, compare and render both variants
        run: bash scripts/reproduce.sh
